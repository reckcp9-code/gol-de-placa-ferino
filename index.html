<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gol de Placa</title><style>body{margin:0;background:#07101d;color:#fff;font:16px Arial}main{max-width:760px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;border-bottom:1px solid #49c8ff55;padding-bottom:18px}h1{margin:5px 0}.tag{color:#69d4ff;font-weight:bold;font-size:12px}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0}button{padding:13px;border:0;border-radius:10px;background:#52c8ff;color:#06111e;font-weight:bold}section{background:#0d1c30;border:1px solid #4bd0ff44;border-radius:20px;padding:22px;margin-top:16px}input,select{box-sizing:border-box;width:100%;margin:9px 0 16px;padding:13px;border-radius:10px;background:#07101d;border:1px solid #fff3;color:#fff}label{display:block;font-weight:bold}.hide{display:none}pre{white-space:pre-wrap;color:#bcecff}.msg{padding:12px;border-radius:10px;margin-top:12px;background:#ffffff12}.result{display:flex;justify-content:space-between;border-bottom:1px solid #ffffff18;padding:9px 0}@media(max-width:520px){header span{display:none}}</style><main><header><div><h1>GOL DE PLACA</h1><small>FERINO FUTEBOL CLUBE</small></div><span>Temporada 2026</span></header><nav><button onclick="show('vote')">Votar</button><button onclick="results()">Ranking 2026</button><button onclick="show('admin')">Admin</button></nav><section id="vote"><p class="tag">VOTAÇÃO ABERTA</p><h1>Escolha os destaques do jogo</h1><p>Seu voto fica secreto. Use o código recebido no grupo.</p><label>Seu código<input id="code" placeholder="GP-4821"></label><label>Bola Cheia<select id="v0"><option value="">Escolha um jogador</option><option>Adrian</option><option>Alejandro</option><option>Allef</option><option>Bruno</option><option>Caiam</option><option>Clovis</option><option>Cristian M</option><option>David</option><option>Deco</option><option>Diego</option><option>Douglas</option><option>Edvandro</option><option>Emerson</option><option>Felipe Chagas</option><option>Ferreira</option><option>Henry</option><option>Irmão do Rodrigo</option><option>Ismael</option><option>João</option><option>Jucemar</option><option>Luigi</option><option>Marcos</option><option>Miguel</option><option>Mi</option><option>Nicolas</option><option>Ninja</option><option>Quintão</option><option>Richard</option><option>Rodrigo</option><option>Sapatenis</option><option>Vascaino</option><option>Vilson</option><option>Wagner</option><option>Welligton</option><option>Will</option></select></label><label>Bola Murcha<select id="v1"><option value="">Escolha um jogador</option><option>Adrian</option><option>Alejandro</option><option>Allef</option><option>Bruno</option><option>Caiam</option><option>Clovis</option><option>Cristian M</option><option>David</option><option>Deco</option><option>Diego</option><option>Douglas</option><option>Edvandro</option><option>Emerson</option><option>Felipe Chagas</option><option>Ferreira</option><option>Henry</option><option>Irmão do Rodrigo</option><option>Ismael</option><option>João</option><option>Jucemar</option><option>Luigi</option><option>Marcos</option><option>Miguel</option><option>Mi</option><option>Nicolas</option><option>Ninja</option><option>Quintão</option><option>Richard</option><option>Rodrigo</option><option>Sapatenis</option><option>Vascaino</option><option>Vilson</option><option>Wagner</option><option>Welligton</option><option>Will</option></select></label><label>Gol do Jogo<select id="v2"><option value="">Escolha um jogador</option><option>Adrian</option><option>Alejandro</option><option>Allef</option><option>Bruno</option><option>Caiam</option><option>Clovis</option><option>Cristian M</option><option>David</option><option>Deco</option><option>Diego</option><option>Douglas</option><option>Edvandro</option><option>Emerson</option><option>Felipe Chagas</option><option>Ferreira</option><option>Henry</option><option>Irmão do Rodrigo</option><option>Ismael</option><option>João</option><option>Jucemar</option><option>Luigi</option><option>Marcos</option><option>Miguel</option><option>Mi</option><option>Nicolas</option><option>Ninja</option><option>Quintão</option><option>Richard</option><option>Rodrigo</option><option>Sapatenis</option><option>Vascaino</option><option>Vilson</option><option>Wagner</option><option>Welligton</option><option>Will</option></select></label><label>Defesa do Jogo<select id="v3"><option value="">Escolha um jogador</option><option>Adrian</option><option>Alejandro</option><option>Allef</option><option>Bruno</option><option>Caiam</option><option>Clovis</option><option>Cristian M</option><option>David</option><option>Deco</option><option>Diego</option><option>Douglas</option><option>Edvandro</option><option>Emerson</option><option>Felipe Chagas</option><option>Ferreira</option><option>Henry</option><option>Irmão do Rodrigo</option><option>Ismael</option><option>João</option><option>Jucemar</option><option>Luigi</option><option>Marcos</option><option>Miguel</option><option>Mi</option><option>Nicolas</option><option>Ninja</option><option>Quintão</option><option>Richard</option><option>Rodrigo</option><option>Sapatenis</option><option>Vascaino</option><option>Vilson</option><option>Wagner</option><option>Welligton</option><option>Will</option></select></label><button onclick="vote()">🔒 Enviar voto secreto</button><div id="voteMsg"></div></section><section id="admin" class="hide"><p class="tag">PAINEL ADMIN</p><h1>Gerar códigos da partida</h1><label>PIN do administrador<input id="pin" type="password" inputmode="numeric"></label><label>Quantidade de jogadores<input id="total" type="number" value="20" min="1" max="60"></label><button onclick="codes()">Gerar códigos</button><pre id="out"></pre></section><section id="rank" class="hide"><p class="tag">RESULTADO</p><h1>Votos da partida</h1><div id="ranking">Carregando...</div></section></main><script>const cats=["Bola Cheia","Bola Murcha","Gol do Jogo","Defesa do Jogo"];function show(id){for(const x of ["vote","admin","rank"])document.getElementById(x).classList.toggle("hide",x!==id)}async function codes(){let r=await fetch("/api/admin/codes",{method:"POST",headers:{"Content-Type":"application/json","x-admin-pin":pin.value},body:JSON.stringify({total:+document.getElementById("total").value})});let d=await r.json();out.textContent=d.codes?d.codes.join("\n"):d.error}async function vote(){let votes={};cats.forEach((c,i)=>votes[c]=document.getElementById("v"+i).value);let r=await fetch("/api/vote",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:code.value,votes})});let d=await r.json();voteMsg.className="msg";voteMsg.textContent=d.ok?"Voto enviado com sucesso!":d.error}async function results(){show("rank");let r=await fetch("/api/results");let d=await r.json();ranking.innerHTML=d.length?d.map(x=>'<div class="result"><span>'+x.category+" — "+x.player+'</span><b>'+x.votes+" voto(s)</b></div>").join(""):"Nenhum voto enviado ainda."}</script></html>
