<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gol de Placa</title><style>body{margin:0;background:#07101d;color:#fff;font:16px Arial}main{max-width:760px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;border-bottom:1px solid #49c8ff55;padding-bottom:18px}h1{margin:5px 0}.tag{color:#69d4ff;font-weight:bold;font-size:12px}nav{display:flex;gap:8px;margin:22px 0}button{padding:12px;border:0;border-radius:10px;background:#52c8ff;color:#06111e;font-weight:bold}section{background:#0d1c30;border:1px solid #4bd0ff44;border-radius:20px;padding:22px;margin-top:16px}input,select{box-sizing:border-box;width:100%;margin:9px 0 16px;padding:13px;border-radius:10px;background:#07101d;border:1px solid #fff3;color:#fff}label{display:block;font-weight:bold}.hide{display:none}pre{white-space:pre-wrap;color:#bcecff}</style><main><header><div><h1>GOL DE PLACA</h1><small>FERINO FUTEBOL CLUBE</small></div><span>Temporada 2026</span></header><nav><button onclick="show('vote')">Votar</button><button onclick="show('rank')">Ranking 2026</button><button onclick="show('admin')">Admin</button></nav><section id="vote"><p class="tag">VOTAÇÃO ABERTA</p><h1>Escolha os destaques do jogo</h1><p>Seu voto fica secreto. Use o código recebido no grupo.</p><label>Seu código<input placeholder="GP-4821"></label><label>🏆 Bola Cheia<select><option>Escolha um jogador</option></select></label><label>🏆 Bola Murcha<select><option>Escolha um jogador</option></select></label><label>🏆 Gol do Jogo<select><option>Escolha um jogador</option></select></label><label>🏆 Defesa do Jogo<select><option>Escolha um jogador</option></select></label><button>🔒 Enviar voto secreto</button></section><section id="admin" class="hide"><p class="tag">PAINEL ADMIN</p><h1>Abrir nova votação</h1><label>Quantidade de códigos<input id="total" type="number" value="20" min="1" max="60"></label><button onclick="codes()">Gerar códigos dos jogadores</button><pre id="out"></pre></section><section id="rank" class="hide"><p class="tag">CONTAGEM 2026</p><h1>Ranking anual</h1><p>O resultado de cada partida será somado aqui quando a votação for encerrada.</p></section></main><script>function show(id){for(const x of ['vote','admin','rank'])document.getElementById(x).classList.toggle('hide',x!==id)}async function codes(){let r=await fetch('/api/admin/codes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({total:+document.getElementById('total').value})});let d=await r.json();document.getElementById('out').textContent=d.codes?d.codes.join('\n'):d.error}</script></html>
