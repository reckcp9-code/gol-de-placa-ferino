{left:37.37%;width:17.95%;padding-left:7.9%}#sv{left:56.1%;width:21.1%;padding-left:7.6%}.o{position:absolute;left:16.88%;top:18.15%;width:60.35%;height:70%;z-index:30;background:#05090df7;border:1px solid #687078;border-radius:10px;padding:2.5%;overflow:auto}.h{display:none}.ttl{font-size:28px;font-weight:950;font-style:italic;border-bottom:1px solid #ffffff18;padding-bottom:12px;margin-bottom:14px}.ttl span{color:#ff7900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#0a0f13;border:1px solid #414950;border-radius:8px;padding:12px}.row{display:flex;justify-content:space-between;border-top:1px solid #ffffff14;padding:8px 0}.gold{color:#ffd22f;font-weight:900}input,select,button{font:inherit}.o input{width:100%;height:40px;background:#05090d;color:#fff;border:1px solid #555;border-radius:7px;padding:0 10px}.o button{height:40px;border:0;border-radius:7px;background:linear-gradient(90deg,#ff7200,#ffc934);font-weight:900;cursor:pointer}.full{width:100%}.adm{display:grid;gap:10px}.adm2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.err{color:#ffd22f;font-weight:900;min-height:20px}.players{display:grid;grid-template-columns:1fr 1fr;gap:5px;max-height:180px;overflow:auto}.pl{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#080d11;border:1px solid #343a40;border-radius:6px;padding:7px}.pl button{width:auto;height:28px;background:#222;color:#fff}.red{background:#ff5148!important}.green{background:#36df86!important}pre{white-space:pre-wrap;max-height:150px;overflow:auto;background:#020507;padding:8px}.mobile{display:none}.ml{display:none}
@media(max-width:800px){html,body{width:100%;overflow-x:hidden;background:#050505}.w{overflow:hidden;width:100%}.mobile{display:none!important}.s{min-width:0!important;width:100%!important;aspect-ratio:auto!important;min-height:1120px;background-size:cover!important;background-position:72% center!important;background-repeat:no-repeat!important;max-width:480px;margin:0 auto}.s:before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.28) 0%,rgba(0,0,0,.56) 18%,rgba(0,0,0,.83) 33%,rgba(0,0,0,.9) 70%,rgba(0,0,0,.72) 100%)}.v,.n,.o{z-index:5}.n{left:12px;right:12px;top:18px;width:auto;height:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}.n button{min-height:48px;border:1px solid #ffffff22;border-radius:10px;padding:0 10px;text-align:center;font-size:13px;background:#080b0ee8}.n button.a{background:linear-gradient(90deg,#ff7300,#ffc82e);color:#111}#st{left:16px;right:16px;top:132px;width:auto;height:104px;border-radius:14px;background:rgba(5,10,14,.92);font-size:15px;box-shadow:0 10px 30px #0008}.ml{display:block;position:absolute;left:16px;right:16px;z-index:12;color:#fff;font-size:13px;font-weight:900;letter-spacing:.03em}.ml0{top:258px}.ml1{top:348px}.ml2{top:438px}.ml3{top:528px}.ml4{top:618px}.x{left:16px!important;right:16px!important;width:auto!important;height:50px!important;padding:0 14px!important;border-radius:10px!important;font-size:16px!important;background:#060b10f2!important;border:1px solid #616b75!important}#c{top:280px!important}#p0{top:370px!important}#p1{top:460px!important}#p2{top:550px!important}#p3{top:640px!important}#vb{left:16px!important;right:16px!important;width:auto!important;top:716px!important;height:56px!important;border-radius:12px!important;font-size:16px!important;box-shadow:0 8px 24px #ff790044}.msg{left:16px!important;right:16px!important;width:auto!important;top:782px!important;font-size:14px}.stat{top:842px!important;height:106px!important;background:rgba(7,12,16,.9);border:1px solid #ffffff18;border-radius:12px;padding:12px!important;justify-content:center;text-align:center}.stat b{font-size:26px!important}.stat small{font-size:11px}.stat i{font-size:10px}#sp{left:16px!important;width:calc((100% - 48px)/3)!important}#sc{left:calc(24px + (100% - 48px)/3)!important;width:calc((100% - 48px)/3)!important}#sv{left:calc(32px + 2*(100% - 48px)/3)!important;width:calc((100% - 48px)/3)!important}.o{left:12px!important;right:12px!important;top:132px!important;width:auto!important;height:auto!important;min-height:820px;max-height:none;padding:18px!important;border-radius:14px!important;background:rgba(4,8,12,.96)!important;overflow:visible!important}.ttl{font-size:23px!important;line-height:1.15}.grid,.adm2,.players{grid-template-columns:1fr!important}.card{padding:13px}.o input,.o button{height:48px!important;font-size:16px}.players{max-height:none}.row{gap:12px;align-items:flex-start}}
</style></head><body><div class="mobile"></div><div class="w"><div class="s" id="s"><nav class="n"><button class="a" data-t="v">🏠 &nbsp;VOTAR</button><button data-t="r">📊 &nbsp;RESULTADO</button><button data-t="k">🏆 &nbsp;RANKING</button><button data-t="a">⚙ &nbsp;ADMIN</button></nav><div id="v" class="v"><div id="st"><div id="os" class="ok">VOTAÇÃO ABERTA</div><div id="mn" class="m">CARREGANDO...</div><div id="pc" class="cnt">—</div></div><div class="ml ml0">🔑 SEU CÓDIGO</div><input id="c" class="x" placeholder="Ex.: GP-4821"><div class="ml ml1">🏆 BOLA CHEIA</div><select id="p0" class="x"></select><div class="ml ml2">🥀 BOLA MURCHA</div><select id="p1" class="x"></select><div class="ml ml3">⚽ GOL DO JOGO</div><select id="p2" class="x"></select><div class="ml ml4">🧤 DEFESA DO JOGO</div><select id="p3" class="x"></select><button id="vb">✈ &nbsp; CONFIRMAR VOTO</button><div id="vm" class="msg"></div><div id="sp" class="stat"><div><small>JOGADORES</small><b id="np">0</b><i>CADASTRADOS</i></div></div><div id="sc" class="stat"><div><small>CÓDIGOS</small><b id="nc">0</b><i>GERADOS</i></div></div><div id="sv" class="stat"><div><small>VOTOS</small><b id="nv">0</b><i>NA PARTIDA</i></div></div></div><section id="r" class="o h"><div class="ttl">RESULTADO <span>DO JOGO</span></div><div id="rm" class="gold"></div><div id="rb" class="grid"></div></section><section id="k" class="o h"><div class="ttl">RANKING <span>GERAL 2026</span></div><div id="kb"></div></section><section id="a" class="o h"><div class="ttl">PAINEL <span>ADMINISTRATIVO</span></div><div class="adm"><div class="adm2"><input id="pin" type="password" placeholder="PIN do administrador"><button id="login">ENTRAR / ATUALIZAR</button></div><div id="am" class="err"></div><div id="ap" class="h"><div class="card"><b id="an"></b><div id="as"></div><div id="ac" class="gold"></div><div class="adm2" style="margin-top:8px"><button id="close" class="red">ENCERRAR VOTAÇÃO</button><button id="open" class="green">REABRIR VOTAÇÃO</button></div></div><div class="adm2"><div class="card"><b>NOVA PARTIDA</b><input id="newm" placeholder="Ferino x Amigos" style="margin:8px 0"><button id="create" class="full">CRIAR PARTIDA</button></div><div class="card"><b>GERAR CÓDIGOS</b><input id="tot" type="number" value="20" min="1" max="60" style="margin:8px 0"><button id="codes" class="full">GERAR CÓDIGOS</button><pre id="out" class="h"></pre></div></div><div class="card"><b>JOGADORES</b><div class="adm2" style="margin:8px 0"><input id="newp" placeholder="Nome do jogador"><button id="add">CADASTRAR</button></div><div id="pls" class="players"></div></div></div></div></section></div></div><script>
const $=i=>document.getElementById(i),C=['Bola Cheia','Bola Murcha','Gol do Jogo','Defesa do Jogo'],L={'Bola Cheia':'🏆 Bola Cheia','Bola Murcha':'🥀 Bola Murcha','Gol do Jogo':'⚽ Gol do Jogo','Defesa do Jogo':'🧤 Defesa do Jogo'};let P=[],R=null;async function q(u,o={}){let r=await fetch(u,{cache:'no-store',...o}),d;try{d=await r.json()}catch{d={error:'Resposta inválida'}}if(!r.ok)throw Error(d.detail?(d.error||'Erro')+' — '+d.detail:(d.error||'Erro '+r.status));return d}function sh(x){['v','r','k','a'].forEach(i=>$(i).classList.toggle('h',i!==x));document.querySelectorAll('.n button').forEach(b=>b.classList.toggle('a',b.dataset.t===x))}function fill(){for(let i=0;i<4;i++){let s=$('p'+i);s.innerHTML='<option value="">Escolha um jogador</option>';P.forEach(p=>s.add(new Option(p.name,p.name)))}$('np').textContent=P.length}async function lp(){try{P=await q('/api/players')}catch{P=[]}fill()}async function st(){try{let d=await q('/api/status');$('mn').textContent=(d.match?.name||'SEM PARTIDA').toUpperCase();$('os').textContent=d.open?'VOTAÇÃO ABERTA':'VOTAÇÃO ENCERRADA';$('os').style.color=d.open?'#38ff7d':'#ff5148';$('pc').textContent=(d.submitted||0)+' / '+(d.total||0)+' VOTOS';$('nc').textContent=d.total||0;$('nv').textContent=d.submitted||0;$('vb').disabled=!d.open}catch(e){$('vm').textContent=e.message}}async function vote(){let votes={};C.forEach((c,i)=>votes[c]=$('p'+i).value);try{await q('/api/vote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('c').value,votes})});$('vm').textContent='✅ VOTO ENVIADO!';$('c').value='';for(let i=0;i<4;i++)$('p'+i).value='';st()}catch(e){$('vm').textContent='❌ '+e.message}}function rr(rows){$('rb').innerHTML='';C.forEach(c=>{let a=rows.filter(x=>x.category===c);if(!a.length)return;let t=Math.max(...a.map(x=>+x.votes)),b=document.createElement('div');b.className='card';b.innerHTML='<b>'+L[c]+'</b><div class="gold" style="margin:8px 0">'+a.filter(x=>+x.votes===t).map(x=>x.player).join(' / ')+' — '+t+' voto(s)</div>';a.forEach(x=>{let r=document.createElement('div');r.className='row';r.innerHTML='<span>'+x.player+'</span><b>'+x.votes+'</b>';b.append(r)});$('rb').append(b)})}async function res(){sh('r');$('rb').textContent='Carregando...';try{let d=await q('/api/results');R=d;$('rm').textContent=d.match.name+' · '+d.match.season;rr(d.rows)}catch(e){$('rb').textContent=e.message}}async function rank(){sh('k');$('kb').textContent='Carregando...';try{let d=await q('/api/ranking?season=2026');$('kb').innerHTML='';d.rows.forEach((x,i)=>{let r=document.createElement('div');r.className='row card';r.innerHTML='<b>#'+(i+1)+' '+x.player+'</b><span>'+x.category+' · 🏆 '+x.titles+'</span>';$('kb').append(r)})}catch(e){$('kb').textContent=e.message}}function msg(t){$('am').textContent=t||''}function plist(a){$('pls').innerHTML='';a.forEach(p=>{let r=document.createElement('div');r.className='pl',n=document.createElement('span'),b=document.createElement('button');n.textContent=p.name+(p.active?'':' · inativo');b.textContent=p.active?'Desativar':'Ativar';b.onclick=()=>tog(p.id,!p.active);r.append(n,b);$('pls').append(r)})}async function ast(){try{let d=await q('/api/admin/status',{headers:{'x-admin-pin':$('pin').value}});$('ap').classList.remove('h');$('an').textContent=d.match?.name||'Nenhuma partida';$('as').textContent=d.match?(d.match.status==='open'?'🟢 Votação aberta':'🔴 Votação encerrada'):'';$('ac').textContent=d.match?d.submitted+' / '+d.total+' códigos usados':'';plist(d.players||[]);return d}catch(e){$('ap').classList.add('h');msg('❌ '+e.message);throw e}}async function cm(){let name=$('newm').value.trim();if(name.length<2)return msg('Digite o nome da partida.');try{let d=await q('/api/admin/matches',{method:'POST',headers:{'Content-Type':'application/json','x-admin-pin':$('pin').value},body:JSON.stringify({name,season:2026})});$('newm').value='';msg('✅ Partida criada: '+d.name);await ast();st()}catch(e){msg('❌ '+e.message)}}async function gc(){try{let d=await q('/api/admin/codes',{method:'POST',headers:{'Content-Type':'application/json','x-admin-pin':$('pin').value},body:JSON.stringify({total:+$('tot').value})});$('out').classList.remove('h');$('out').textContent=d.codes.join('\n');msg('✅ '+d.codes.length+' códigos gerados.');await ast();st()}catch(e){msg('❌ '+e.message)}}async function ap(){let name=$('newp').value.trim();if(name.length<2)return msg('Digite o nome.');try{let d=await q('/api/admin/players',{method:'POST',headers:{'Content-Type':'application/json','x-admin-pin':$('pin').value},body:JSON.stringify({name})});$('newp').value='';msg('✅ '+d.player.name+' cadastrado.');await ast();lp()}catch(e){msg('❌ '+e.message)}}async function cv(){if(!confirm('Encerrar votação?'))return;try{await q('/api/admin/close',{method:'POST',headers:{'x-admin-pin':$('pin').value}});msg('🏁 Votação encerrada.');ast();st()}catch(e){msg('❌ '+e.message)}}async function ov(){try{await q('/api/admin/open',{method:'POST',headers:{'x-admin-pin':$('pin').value}});msg('▶ Votação reaberta.');ast();st()}catch(e){msg('❌ '+e.message)}}async function tog(id,active){try{await q('/api/admin/players/toggle',{method:'POST',headers:{'Content-Type':'application/json','x-admin-pin':$('pin').value},body:JSON.stringify({id,active})});ast();lp()}catch(e){msg('❌ '+e.message)}}document.querySelectorAll('.n button').forEach(b=>b.onclick=()=>{let t=b.dataset.t;t==='r'?res():t==='k'?rank():sh(t)});$('vb').onclick=vote;$('login').onclick=ast;$('create').onclick=cm;$('codes').onclick=gc;$('add').onclick=ap;$('close').onclick=cv;$('open').onclick=ov;fetch('/ferino-bg.b64').then(r=>r.text()).then(t=>$('s').style.backgroundImage='url("data:image/webp;base64,'+t.trim()+'")');lp();st();
</script></body></html>
