<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gol de Placa — Ferino Futebol Clube</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}body{display:flex;justify-content:center}.app{width:min(100vw,480px);min-height:100vh;background:#050505}.s{position:relative;width:100%;aspect-ratio:400/710;background:#050505 center/100% 100% no-repeat;overflow:hidden;isolation:isolate}.s.loading:after{content:'CARREGANDO ARTE...';position:absolute;inset:auto 0 18px;text-align:center;color:#ffcc35;font-weight:900;font-size:12px;letter-spacing:.15em}.h{display:none!important}button,input,select{font:inherit}.tap{position:absolute;z-index:20;border:0;background:transparent;color:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}.tap.a{outline:2px solid rgba(255,197,43,.0)}#btV{left:4%;top:18.15%;width:22%;height:7.75%}#btR{left:27.25%;top:18.15%;width:22%;height:7.75%}#btK{left:50.5%;top:18.15%;width:22%;height:7.75%}#btA{left:73.25%;top:18.15%;width:22%;height:7.75%}.v{position:absolute;inset:0;z-index:10}.field{position:absolute;z-index:25;border:0;outline:0;background:rgba(2,7,12,.08);color:#f2f5f8;border-radius:10px;padding:0 14px;font-weight:500;font-size:clamp(13px,4.4vw,18px);appearance:auto}.field::placeholder{color:rgba(238,241,245,.72)}select.field{color:#f4f7fa;background:rgba(2,7,12,.06);padding-right:28px}#c{left:34.9%;top:41.35%;width:58.8%;height:4.55%}#p0{left:34.9%;top:48.1%;width:58.8%;height:4.6%}#p1{left:34.9%;top:55.05%;width:58.8%;height:4.6%}#p2{left:34.9%;top:62.0%;width:58.8%;height:4.6%}#p3{left:34.9%;top:68.9%;width:58.8%;height:4.6%}#vb{position:absolute;z-index:30;left:4%;top:74.8%;width:92%;height:6.65%;border:0;background:transparent;color:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}.msg{position:absolute;z-index:40;left:5%;right:5%;top:81.9%;min-height:24px;text-align:center;font-size:13px;font-weight:900;color:#fff;text-shadow:0 2px 8px #000}.msg.ok{color:#30ff78}.msg.err{color:#ffcf39}.live{position:absolute;z-index:22;text-align:center;text-shadow:0 2px 8px #000}.live.status{left:4%;top:27.9%;width:92%;height:9%;pointer-events:none}.live .open{display:block;font-size:clamp(15px,5.1vw,23px);font-weight:950;color:#31ff78;letter-spacing:.02em}.live .match{display:block;margin-top:5px;font-size:clamp(19px,7.2vw,32px);font-weight:950}.live .count{display:block;margin-top:3px;font-size:clamp(18px,6.2vw,29px);font-weight:950;color:#ffd037}.statnum{position:absolute;z-index:22;text-align:center;color:#ffd037;font-size:clamp(22px,8vw,38px);font-weight:950;text-shadow:0 2px 10px #000;pointer-events:none}.statnum small{display:block;color:#fff;font-size:clamp(9px,2.8vw,12px);letter-spacing:.04em}.sp{left:5.5%;top:86.6%;width:27%}.sc{left:36.5%;top:86.6%;width:27%}.sv{left:67.3%;top:86.6%;width:27%}.panel{position:absolute;z-index:50;left:4%;right:4%;top:27.5%;bottom:4%;padding:18px;border:1px solid rgba(255,255,255,.22);border-radius:16px;background:linear-gradient(180deg,rgba(5,10,14,.96),rgba(2,4,7,.96));box-shadow:0 18px 45px #000b;overflow:auto}.ttl{font-size:22px;font-weight:950;font-style:italic;margin:0 0 14px}.ttl span{color:#ffb21c}.card{border:1px solid rgba(255,255,255,.16);background:rgba(8,14,19,.82);border-radius:13px;padding:12px;margin-bottom:10px}.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid rgba(255,255,255,.12)}.row:first-child{border-top:0}.gold{color:#ffd037;font-weight:900}.grid{display:grid;gap:10px}.admin input,.admin button{width:100%;min-height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.22);padding:0 12px}.admin input{background:#05090d;color:#fff}.admin button{border:0;background:linear-gradient(90deg,#ff7a00,#ffd02c);color:#111;font-weight:950}.admin .danger{background:#ff5454;color:#111}.admin .go{background:#39df88;color:#07120b}.players{display:grid;gap:7px;max-height:260px;overflow:auto}.pl{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:8px;background:rgba(0,0,0,.35)}.pl button{width:auto;min-height:30px;padding:0 10px;background:#1d2530;color:#fff}.codes{white-space:pre-wrap;background:#030608;border-radius:10px;padding:10px;max-height:180px;overflow:auto}.hide-vis{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}@media(min-width:801px){body{align-items:flex-start;padding:20px}.app{max-width:520px}.s{border-radius:22px;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 18px 60px #000}.field{font-size:18px}.msg{font-size:15px}}@media(max-width:390px){.field{font-size:15px;padding-left:10px}.panel{padding:14px}.ttl{font-size:20px}}
</style>
</head>
<body>
<div class="app"><div class="s loading" id="s">
<nav>
<button class="tap a" id="btV" data-t="v">Votar</button><button class="tap" id="btR" data-t="r">Resultado</button><button class="tap" id="btK" data-t="k">Ranking</button><button class="tap" id="btA" data-t="a">Admin</button>
</nav>
<div id="v" class="v">
<div class="live status"><span id="os" class="open">● VOTAÇÃO ABERTA</span><span id="mn" class="match">MBV</span><span id="pc" class="count">0 / 20 VOTOS</span></div>
<input id="c" class="field" autocomplete="off" placeholder="Ex.: GP-4821" aria-label="Seu código">
<select id="p0" class="field" aria-label="Bola Cheia"></select>
<select id="p1" class="field" aria-label="Bola Murcha"></select>
<select id="p2" class="field" aria-label="Gol do Jogo"></select>
<select id="p3" class="field" aria-label="Defesa do Jogo"></select>
<button id="vb" aria-label="Confirmar voto">Confirmar voto</button>
<div id="vm" class="msg" aria-live="polite"></div>
<div class="statnum sp"><b id="np">0</b><small>JOGADORES</small></div><div class="statnum sc"><b id="nc">0</b><small>CÓDIGOS</small></div><div class="statnum sv"><b id="nv">0</b><small>VOTOS</small></div>
</div>
<section id="r" class="panel h"><h2 class="ttl">RESULTADO <span>DO JOGO</span></h2><div id="rm" class="gold"></div><div id="rb" class="grid"></div></section>
<section id="k" class="panel h"><h2 class="ttl">RANKING <span>GERAL 2026</span></h2><div id="kb"></div></section>
<section id="a" class="panel admin h"><h2 class="ttl">PAINEL <span>ADMIN</span></h2><div class="grid"><input id="pin" type="password" placeholder="PIN do administrador"><button id="login">ENTRAR / ATUALIZAR</button><div id="am" class="gold"></div><div id="ap" class="h"><div class="card"><b id="an"></b><div id="as"></div><div id="ac" class="gold"></div><div class="grid" style="grid-template-columns:1fr 1fr;margin-top:10px"><button id="close" class="danger">ENCERRAR</button><button id="open" class="go">REABRIR</button></div></div><div class="card"><b>NOVA PARTIDA</b><input id="newm" placeholder="Ferino x Amigos" style="margin:8px 0"><button id="create">CRIAR PARTIDA</button></div><div class="card"><b>GERAR CÓDIGOS</b><input id="tot" type="number" value="20" min="1" max="80" style="margin:8px 0"><button id="codes">GERAR CÓDIGOS</button><pre id="out" class="codes h"></pre></div><div class="card"><b>JOGADORES</b><input id="newp" placeholder="Nome do jogador" style="margin:8px 0"><button id="add">CADASTRAR JOGADOR</button><div id="pls" class="players" style="margin-top:10px"></div></div></div></div></section>
</div></div>
<script>
const $=i=>document.getElementById(i),C=['Bola Cheia','Bola Murcha','Gol do Jogo','Defesa do Jogo'],L={'Bola Cheia':'🏆 Bola Cheia','Bola Murcha':'🥀 Bola Murcha','Gol do Jogo':'⚽ Gol do Jogo','Defesa do Jogo':'🧤 Defesa do Jogo'};let P=[];async function q(u,o={}){let r=await fetch(u,{cache:'no-store',...o}),d;try{d=await r.json()}catch{d={error:'Resposta inválida'}}if(!r.ok)throw Error(d.detail?(d.error||'Erro')+' — '+d.detail:(d.error||'Erro '+r.status));return d}function sh(x){['v','r','k','a'].forEach(i=>$(i).classList.toggle('h',i!==x));document.querySelectorAll('.tap').forEach(b=>b.classList.toggle('a',b.dataset.t===x));if(x==='r')res();if(x==='k')rank()}function fill(){for(let i=0;i<4;i++){let s=$('p'+i);s.innerHTML='<option value="">Escolha um jogador</option>';P.filter(p=>p.active!==false).forEach(p=>s.add(new Option(p.name,p.name)))}$('np').textContent=P.length}async function lp(){try{P=await q('/api/players')}catch{P=[]}fill()}async function st(){try{let d=await q('/api/status');$('mn').textContent=(d.match?.name||'SEM PARTIDA').toUpperCase();$('os').textContent=d.open?'● VOTAÇÃO ABERTA':'● VOTAÇÃO ENCERRADA';$('os').style.color=d.open?'#31ff78':'#ff5858';$('pc').textContent=(d.submitted||0)+' / '+(d.total||0)+' VOTOS';$('nc').textContent=d.total||0;$('nv').textContent=d.submitted||0;$('vb').disabled=!d.open}catch(e){$('vm').textContent=e.message}}async function vote(){let votes={};C.forEach((c,i)=>votes[c]=$('p'+i).value);try{await q('/api/vote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('c').value.trim(),votes})});$('vm').className='msg ok';$('vm').textContent='✅ VOTO CONFIRMADO';$('c').value='';for(let i=0;i<4;i++)$('p'+i).value='';st()}catch(e){$('vm').className='msg err';$('vm').textContent='❌ '+e.message}}function rr(rows){$('rb').innerHTML='';C.forEach(c=>{let a=rows.filter(x=>x.category===c);if(!a.length)return;let t=Math.max(...a.map(x=>+x.votes||0)),b=document.createElement('div');b.className='card';b.innerHTML='<b>'+L[c]+'</b><div class="gold" style="margin:8px 0">'+a.filter(x=>(+x.votes||0)===t).map(x=>x.player).join(' / ')+' — '+t+' voto(s)</div>';a.forEach(x=>{let r=document.createElement('div');r.className='row';r.innerHTML='<span>'+x.player+'</span><b>'+x.votes+'</b>';b.append(r)});$('rb').append(b)})}async function res(){$('rb').textContent='Carregando...';try{let d=await q('/api/results');$('rm').textContent=(d.match?.name||'Partida')+' · '+(d.match?.season||2026);rr(d.rows||[])}catch(e){$('rb').textContent=e.message}}async function rank(){$('kb').textContent='Carregando...';try{let d=await q('/api/ranking?season=2026');$('kb').innerHTML='';(d.rows||[]).forEach((x,i)=>{let r=document.createElement('div');r.className='row card';r.innerHTML='<b>#'+(i+1)+' '+x.player+'</b><span>'+x.category+' · 🏆 '+x.titles+'</span>';$('kb').append(r)});if(!(d.rows||[]).length)$('kb').textContent='Sem ranking ainda.'}catch(e){$('kb').textContent=e.message}}function msg(t){$('am').textContent=t||''}function plist(a){$('pls').innerHTML='';a.forEach(p=>{let r=document.createElement('div');r.className='pl';let b=document.createElement('button');b.textContent=p.active?'Desativar':'Ativar';b.onclick=()=>tog(p.id,!p.active);r.innerHTML='<span>'+p.name+(p.active?'':' · inativo')+'</span>';r.append(b);$('pls').append(r)})}async function ast(){try{let d=await q('/api/admin/status',{headers:{'x-admin-pin':$('pin').value}});$('ap').classList.remove('h');$('an').textContent=d.match?.name||'Nenhuma partida';$('as').textContent=d.match?(d.match.status==='open'?'🟢 Votação aberta':'🔴 Votação encerrada'):'';$('ac').textContent=d.match?d.submitted+' / '+d.total+' códigos usados':'';plist(d.players||[]);msg('✅ Painel carregado');return d}catch(e){$('ap').classList.add('h');msg('❌ '+e.message);throw e}}async function cm(){let name=$('newm').value.trim();if(name.length<2)return msg('Digite o nome da partida.');try{let d=await q('/api/admin/matches',{method:'POST',headers:{'Content-Type':'application/json','x-admin-pin':$('pin').value},body:JSON.stringify({name,season:2026})});$('newm').value='';msg('✅ Partida criada: '+d.name);await ast();st()}catch(e){msg('❌ '+e.message)}}async function gc(){try{let d=await q('/api/admin/codes',{method:'POST',headers:{'Content-Type':'application/json','x-admin-pin':$('pin').value},body:JSON.stringify({total:+$('tot').value})});$('out').classList.remove('h');$('out').textContent=d.codes.join('\n');msg('✅ '+d.codes.length+' códigos gerados.');await ast();st()}catch(e){msg('❌ '+e.message)}}async function ap(){let name=$('newp').value.trim();if(name.length<2)return msg('Digite o nome.');try{let d=await q('/api/admin/players',{method:'POST',headers:{'Content-Type':'application/json','x-admin-pin':$('pin').value},body:JSON.stringify({name})});$('newp').value='';msg('✅ '+d.player.name+' cadastrado.');await ast();lp()}catch(e){msg('❌ '+e.message)}}async function cv(){if(!confirm('Encerrar votação?'))return;try{await q('/api/admin/close',{method:'POST',headers:{'x-admin-pin':$('pin').value}});msg('🏁 Votação encerrada.');ast();st()}catch(e){msg('❌ '+e.message)}}async function ov(){try{await q('/api/admin/open',{method:'POST',headers:{'x-admin-pin':$('pin').value}});msg('▶ Votação reaberta.');ast();st()}catch(e){msg('❌ '+e.message)}}async function tog(id,active){try{await q('/api/admin/players/toggle',{method:'POST',headers:{'Content-Type':'application/json','x-admin-pin':$('pin').value},body:JSON.stringify({id,active})});ast();lp()}catch(e){msg('❌ '+e.message)}}async function bg(){try{let parts=await Promise.all([0,1,2,3,4,5,6,7].map(i=>fetch('/ferino-mobile-bg-'+i+'.txt?v=50',{cache:'no-store'}).then(r=>r.text())));$('s').style.backgroundImage='url("data:image/webp;base64,'+parts.join('').trim()+'")';$('s').classList.remove('loading')}catch(e){console.error(e)}}document.querySelectorAll('.tap').forEach(b=>b.onclick=()=>sh(b.dataset.t));$('vb').onclick=vote;$('login').onclick=ast;$('create').onclick=cm;$('codes').onclick=gc;$('add').onclick=ap;$('close').onclick=cv;$('open').onclick=ov;bg();lp();st();
</script>
</body></html>
